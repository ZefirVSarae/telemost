<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Telemost In World</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rubik:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * { user-select: none; -webkit-user-select: none; touch-action: none; }
        body {
            font-family: 'Rubik', sans-serif;
            background-color: #f8fafc;
            overflow: hidden; margin: 0; padding: 0;
            width: 100vw; height: 100vh;
        }
        .pixel-font { font-family: 'Press Start 2P', cursive; }
        canvas { display: block; width: 100vw; height: 100vh; background-color: #ffffff; }
        @keyframes pulse-subtle { 0%,100% { transform: scale(1);} 50% { transform: scale(1.05);} }
        .animate-pulse-subtle { animation: pulse-subtle 2s infinite ease-in-out; }
    </style>
</head>
<body class="relative bg-white text-slate-800">

    <canvas id="gameCanvas"></canvas>

    <!-- Main Menu -->
    <div id="mainMenu" class="absolute inset-0 z-40 flex flex-col items-center justify-center bg-white/90 backdrop-blur-md">
        <div class="max-w-md w-full p-8 text-center bg-white rounded-3xl shadow-2xl border-4 border-amber-400 m-4 flex flex-col items-center">
            <div class="w-24 h-24 mb-4 rounded-2xl bg-amber-100 flex items-center justify-center p-2 shadow-inner border-2 border-amber-300">
                <img id="menuLogo" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSOBUZMmZZO3cgDt4KJUJDeOv2jdKiIAniR4sLSGvnsWRPFNzSQ0KKaPbPu&s=10" alt="Telemost Logo" class="w-full h-full object-contain animate-pulse-subtle">
            </div>
            <h1 class="pixel-font text-2xl sm:text-3xl font-extrabold text-amber-500 mb-2 tracking-tight drop-shadow-sm">
                Telemost In World
            </h1>
            <p class="text-slate-500 mb-6 text-sm font-medium">Одиночка с NPC или открытый мультиплеер</p>

            <input id="nameInput" maxlength="14" placeholder="Ваш ник" class="w-full mb-4 py-3 px-4 rounded-2xl border-2 border-slate-200 focus:border-amber-400 outline-none text-center font-bold text-slate-700 transition" />

            <div class="space-y-3 w-full">
                <button id="btnPlay" class="w-full py-4 px-6 bg-gradient-to-r from-amber-400 to-amber-500 hover:from-amber-500 hover:to-amber-600 text-white font-bold text-lg rounded-2xl shadow-lg transition transform active:scale-95 flex items-center justify-center gap-2">
                    🎮 ОДИНОЧНАЯ ИГРА
                </button>

                <button id="btnMulti" class="w-full py-4 px-6 bg-gradient-to-r from-indigo-500 to-blue-600 hover:from-indigo-600 hover:to-blue-700 text-white font-bold text-lg rounded-2xl shadow-lg transition transform active:scale-95 flex items-center justify-center gap-2">
                    🌐 МУЛЬТИПЛЕЕР
                </button>
            </div>

            <div id="mpStatus" class="mt-4 text-xs text-slate-400 font-mono"></div>

            <div class="mt-6 text-xs text-slate-400 font-mono">
                Управление: Свайп/Джойстик или WASD / Стрелочки + Пробел для удара
            </div>
        </div>
    </div>

    <!-- HUD -->
    <div id="gameHUD" class="hidden absolute inset-0 pointer-events-none z-20 flex-col justify-between p-4 sm:p-6">
        <div class="flex justify-between items-start gap-4 w-full max-w-4xl mx-auto">
            <div class="bg-white/90 backdrop-blur-md p-3 sm:p-4 rounded-2xl shadow-lg border border-slate-200 pointer-events-auto flex flex-col gap-2 min-w-[180px] sm:min-w-[220px]">
                <div>
                    <div class="flex justify-between text-xs font-bold text-slate-600 mb-1">
                        <span>❤️ ЗДОРОВЬЕ</span>
                        <span id="hpText">100 / 100</span>
                    </div>
                    <div class="w-full h-3 bg-slate-100 rounded-full overflow-hidden border border-slate-200">
                        <div id="hpBar" class="h-full bg-rose-500 transition-all duration-150 rounded-full" style="width: 100%;"></div>
                    </div>
                </div>
                <div>
                    <div class="flex justify-between text-xs font-bold text-slate-600 mb-1">
                        <span>🍗 СЫТОСТЬ</span>
                        <span id="hungerText">100 / 100</span>
                    </div>
                    <div class="w-full h-3 bg-slate-100 rounded-full overflow-hidden border border-slate-200">
                        <div id="hungerBar" class="h-full bg-amber-500 transition-all duration-150 rounded-full" style="width: 100%;"></div>
                    </div>
                </div>
            </div>

            <div class="bg-white/90 backdrop-blur-md p-3 sm:p-4 rounded-2xl shadow-lg border border-slate-200 pointer-events-auto flex flex-col items-end text-right">
                <div id="scoreLabel" class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Победил в баттлах</div>
                <div id="scoreText" class="pixel-font text-xl sm:text-2xl text-amber-500 font-extrabold">0</div>
                <div id="coordsText" class="text-[10px] text-slate-400 font-mono mt-1">X: 0 | Y: 0</div>
                <div id="onlineText" class="text-[10px] text-indigo-500 font-mono mt-1"></div>
            </div>
        </div>

        <div class="w-full flex justify-between items-end pointer-events-none pb-2">
            <div id="joystickZone" class="pointer-events-auto relative w-36 h-36 sm:w-44 sm:h-44 bg-slate-800/10 backdrop-blur-sm rounded-full border-2 border-slate-400/30 flex items-center justify-center touch-none">
                <div id="joystickKnob" class="absolute w-14 h-14 sm:w-16 sm:h-16 bg-gradient-to-tr from-amber-400 to-amber-500 rounded-full shadow-md border-2 border-white transition-transform duration-75"></div>
            </div>

            <div class="hidden sm:block text-xs font-semibold text-slate-400 bg-white/80 p-2 rounded-lg backdrop-blur">
                [WASD] — Ходьба | [Пробел] — Удар 🥊
            </div>

            <div class="pointer-events-auto flex flex-col items-center gap-2">
                <button id="btnAttack" class="w-20 h-20 sm:w-24 sm:h-24 bg-gradient-to-tr from-red-500 to-rose-600 hover:from-red-600 hover:to-rose-700 active:scale-90 text-white font-extrabold rounded-full shadow-2xl border-4 border-white flex flex-col items-center justify-center transition-transform touch-none">
                    <span class="text-3xl sm:text-4xl">🥊</span>
                    <span class="text-[10px] sm:text-xs font-bold uppercase tracking-wider">УДАР</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Game Over -->
    <div id="gameOverModal" class="hidden absolute inset-0 z-50 flex items-center justify-center bg-red-950/80 backdrop-blur-md p-4">
        <div class="max-w-md w-full bg-white rounded-3xl shadow-2xl border-4 border-slate-800 p-8 text-center">
            <div class="text-5xl mb-4">💀</div>
            <h2 class="pixel-font text-2xl font-extrabold text-red-600 mb-2">ВЫ ПОГИБЛИ</h2>
            <p id="deathReason" class="text-slate-600 text-sm mb-6">Ваш Телемост отключился от эфира...</p>
            <div class="bg-slate-50 p-4 rounded-2xl mb-6 border border-slate-200">
                <div class="text-xs text-slate-400 font-medium uppercase">Счёт</div>
                <div id="finalScore" class="pixel-font text-2xl text-slate-800 mt-1">0</div>
            </div>
            <button id="btnRestart" class="w-full py-4 px-6 bg-amber-500 hover:bg-amber-600 text-white font-bold text-lg rounded-2xl shadow-lg transition transform active:scale-95">
                ПОПРОБОВАТЬ СНОВА
            </button>
            <button id="btnExit" class="w-full mt-3 py-3 px-6 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold rounded-2xl transition transform active:scale-95">
                В МЕНЮ
            </button>
        </div>
    </div>

<script type="module">
    // ================= FIREBASE =================
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
    import {
        getDatabase, ref, set, onValue, onChildAdded, onChildRemoved,
        onDisconnect, remove, push
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDMW0lWrnM7gwQ6y3b2qD_dfsEjRnlYg8w",
        authDomain: "telemistman12.firebaseapp.com",
        databaseURL: "https://telemistman12-default-rtdb.firebaseio.com",
        projectId: "telemistman12",
        storageBucket: "telemistman12.firebasestorage.app",
        messagingSenderId: "777404630954",
        appId: "1:777404630954:web:1a51e95bc3bd690c01cdd3"
    };

    const fbApp = initializeApp(firebaseConfig);
    const db = getDatabase(fbApp);

    // ================= ASSETS =================
    const PLAYER_IMG_SRC = "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSOBUZMmZZO3cgDt4KJUJDeOv2jdKiIAniR4sLSGvnsWRPFNzSQ0KKaPbPu&s=10";
    const FOOD_IMG_SRC = "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSlr_mf5YH3ITEVDeAlsWUf4t0UjM50vHY7489vGAOpvtOa4aqsBTyf-dg&s=10";

    const playerImg = new Image(); playerImg.src = PLAYER_IMG_SRC;
    const foodImg = new Image(); foodImg.src = FOOD_IMG_SRC;

    // ================= CANVAS =================
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let width = window.innerWidth, height = window.innerHeight;
    function resizeCanvas() {
        width = window.innerWidth; height = window.innerHeight;
        canvas.width = width; canvas.height = height;
    }
    window.addEventListener('resize', resizeCanvas); resizeCanvas();

    // ================= STATE =================
    const STATE = { MENU: 0, PLAYING: 1, GAMEOVER: 2 };
    let currentState = STATE.MENU;
    let multiplayerMode = false;

    const player = {
        x: 0, y: 0, radius: 30, speed: 300,
        hp: 100, maxHp: 100,
        hunger: 100, maxHunger: 100,
        score: 0,
        attackCooldown: 0, facingAngle: 0
    };

    let foods = [], npcs = [], damageTexts = [], punchEffects = [];

    const keys = {
        KeyW:false, KeyA:false, KeyS:false, KeyD:false,
        ArrowUp:false, ArrowLeft:false, ArrowDown:false, ArrowRight:false,
        Space:false
    };

    const joystick = { active:false, startX:0, startY:0, vectorX:0, vectorY:0 };

    // ====== MULTIPLAYER STATE ======
    let myId = localStorage.getItem('telem_id');
    if (!myId) {
        myId = 'p_' + Math.random().toString(36).slice(2, 10);
        localStorage.setItem('telem_id', myId);
    }
    let myName = 'Игрок';
    let myHue = 0;
    const remotePlayers = new Map(); // id -> data
    let lastSend = 0;
    let myHitsRef = null;
    let myPlayerRef = null;
    let playersListenerOff = null;
    let hitsListenerOff = null;

    function hashCode(str) {
        let h = 0;
        for (let i = 0; i < str.length; i++) h = ((h << 5) - h) + str.charCodeAt(i);
        return Math.abs(h);
    }

    // ================= INPUT =================
    window.addEventListener('keydown', (e) => {
        if (Object.prototype.hasOwnProperty.call(keys, e.code)) keys[e.code] = true;
        if (e.code === 'Space' && currentState === STATE.PLAYING) {
            e.preventDefault();
            performPlayerAttack();
        }
    });
    window.addEventListener('keyup', (e) => {
        if (Object.prototype.hasOwnProperty.call(keys, e.code)) keys[e.code] = false;
    });

    const joystickZone = document.getElementById('joystickZone');
    const joystickKnob = document.getElementById('joystickKnob');
    const maxRadius = 50;

    function handleTouchStart(e) {
        e.preventDefault();
        const touch = e.touches[0];
        const rect = joystickZone.getBoundingClientRect();
        joystick.active = true;
        joystick.startX = rect.left + rect.width / 2;
        joystick.startY = rect.top + rect.height / 2;
        updateJoystick(touch.clientX, touch.clientY);
    }
    function handleTouchMove(e) {
        if (!joystick.active) return;
        e.preventDefault();
        updateJoystick(e.touches[0].clientX, e.touches[0].clientY);
    }
    function handleTouchEnd() {
        joystick.active = false;
        joystick.vectorX = 0; joystick.vectorY = 0;
        joystickKnob.style.transform = 'translate(0px, 0px)';
    }
    function updateJoystick(clientX, clientY) {
        let dx = clientX - joystick.startX;
        let dy = clientY - joystick.startY;
        const dist = Math.hypot(dx, dy);
        if (dist > maxRadius) { dx = (dx / dist) * maxRadius; dy = (dy / dist) * maxRadius; }
        joystickKnob.style.transform = `translate(${dx}px, ${dy}px)`;
        joystick.vectorX = dx / maxRadius;
        joystick.vectorY = dy / maxRadius;
    }
    joystickZone.addEventListener('touchstart', handleTouchStart, { passive:false });
    joystickZone.addEventListener('touchmove', handleTouchMove, { passive:false });
    joystickZone.addEventListener('touchend', handleTouchEnd);
    joystickZone.addEventListener('touchcancel', handleTouchEnd);

    const btnAttack = document.getElementById('btnAttack');
    btnAttack.addEventListener('touchstart', (e) => { e.preventDefault(); performPlayerAttack(); }, { passive:false });
    btnAttack.addEventListener('mousedown', (e) => { e.preventDefault(); performPlayerAttack(); });

    // ================= GAME LOGIC =================
    function initGame() {
        player.x = 0; player.y = 0;
        player.hp = player.maxHp;
        player.hunger = player.maxHunger;
        player.score = 0;
        player.attackCooldown = 0;
        player.facingAngle = 0;

        foods = []; npcs = []; damageTexts = []; punchEffects = [];
        remotePlayers.clear();

        if (!multiplayerMode) {
            for (let i = 0; i < 25; i++) spawnFood(rand(-1000,1000), rand(-1000,1000));
            for (let i = 0; i < 5; i++) spawnNPC(rand(-800,800), rand(-800,800));
        }

        handleTouchEnd();
        updateHUD();
    }

    function rand(a,b) { return Math.random() * (b - a) + a; }

    function spawnFood(x, y) { foods.push({ x, y, radius: 18, value: 30 }); }

    function spawnNPC(x, y) {
        const maxHp = 70 + Math.floor(Math.random() * 50);
        npcs.push({
            x, y, radius: 32,
            vx: (Math.random() - 0.5) * 90,
            vy: (Math.random() - 0.5) * 90,
            hp: maxHp, maxHp,
            isAggro: false, attackCooldown: 0, flashTimer: 0, speed: 140
        });
    }

    function maintainWorldEntities() {
        if (multiplayerMode) return;

        while (foods.length < 35) {
            const a = Math.random() * Math.PI * 2;
            const d = 400 + Math.random() * 1200;
            spawnFood(player.x + Math.cos(a) * d, player.y + Math.sin(a) * d);
        }
        while (npcs.length < 7) {
            const a = Math.random() * Math.PI * 2;
            const d = 700 + Math.random() * 1000;
            spawnNPC(player.x + Math.cos(a) * d, player.y + Math.sin(a) * d);
        }
        foods = foods.filter(f => Math.hypot(f.x - player.x, f.y - player.y) < 2500);
        npcs = npcs.filter(n => Math.hypot(n.x - player.x, n.y - player.y) < 2500);
    }

    // ================ ATTACK =================
    function performPlayerAttack() {
        if (currentState !== STATE.PLAYING) return;
        if (player.attackCooldown > 0) return;
        player.attackCooldown = 0.25;

        const attackRange = 85;
        const attackAngle = player.facingAngle;

        punchEffects.push({
            x: player.x + Math.cos(attackAngle) * 35,
            y: player.y + Math.sin(attackAngle) * 35,
            radius: 20, maxRadius: 55, alpha: 1.0
        });

        if (multiplayerMode) {
            // Атака по другим игрокам
            remotePlayers.forEach((rp, id) => {
                const dist = Math.hypot(rp.x - player.x, rp.y - player.y);
                if (dist <= attackRange + 30) {
                    // проверка угла (чтобы бить только вперёд)
                    const angleToTarget = Math.atan2(rp.y - player.y, rp.x - player.x);
                    let diff = Math.abs(angleToTarget - attackAngle);
                    while (diff > Math.PI) diff = Math.abs(diff - Math.PI * 2);
                    if (diff > Math.PI / 1.6) return; // ~112 градусов конус

                    const dmg = 15 + Math.floor(Math.random() * 11);
                    const hitRef = push(ref(db, 'hits/' + id));
                    set(hitRef, {
                        damage: dmg,
                        fromName: myName,
                        fromId: myId,
                        ts: Date.now()
                    });

                    player.score++;
                    damageTexts.push({
                        text: `УДАР!`,
                        x: player.x + Math.cos(attackAngle) * 60,
                        y: player.y - 40,
                        color: '#22c55e', life: 0.7
                    });
                }
            });
        } else {
            // Атака по NPC
            for (let i = npcs.length - 1; i >= 0; i--) {
                const npc = npcs[i];
                const dist = Math.hypot(npc.x - player.x, npc.y - player.y);
                if (dist <= attackRange + npc.radius) {
                    const dmg = 20 + Math.floor(Math.random() * 15);
                    npc.hp -= dmg;
                    npc.isAggro = true;
                    npc.flashTimer = 0.2;

                    const kbA = Math.atan2(npc.y - player.y, npc.x - player.x);
                    npc.x += Math.cos(kbA) * 35;
                    npc.y += Math.sin(kbA) * 35;

                    damageTexts.push({ text: `-${dmg}`, x: npc.x, y: npc.y - 30, color: '#ef4444', life: 0.8 });

                    if (npc.hp <= 0) {
                        player.score++;
                        player.hunger = Math.min(player.maxHunger, player.hunger + 30);
                        damageTexts.push({ text: '+1 ПОБЕДА!', x: npc.x, y: npc.y - 50, color: '#eab308', life: 1.2 });
                        spawnFood(npc.x, npc.y);
                        npcs.splice(i, 1);
                    }
                }
            }
        }
    }

    // ============ MULTIPLAYER NET ============
    function startMultiplayer() {
        multiplayerMode = true;
        myName = (document.getElementById('nameInput').value || 'Игрок').slice(0, 14);
        myHue = hashCode(myId) % 360;

        myPlayerRef = ref(db, 'players/' + myId);
        myHitsRef = ref(db, 'hits/' + myId);

        // При отключении — удаляем себя
        onDisconnect(myPlayerRef).remove();

        // Первичная запись
        set(myPlayerRef, {
            name: myName, x: 0, y: 0, angle: 0,
            hp: player.maxHp, score: 0,
            hue: myHue, lastSeen: Date.now()
        });

        // Слушаем список игроков
        playersListenerOff = onValue(ref(db, 'players'), (snap) => {
            remotePlayers.clear();
            const now = Date.now();
            snap.forEach(child => {
                const id = child.key;
                if (id === myId) return;
                const p = child.val();
                if (!p) return;
                if (now - (p.lastSeen || 0) > 15000) return;
                remotePlayers.set(id, p);
            });
            document.getElementById('onlineText').innerText = `🌐 онлайн: ${remotePlayers.size + 1}`;
        });

        // Слушаем входящие удары по мне
        hitsListenerOff = onChildAdded(myHitsRef, (snapshot) => {
            const hit = snapshot.val();
            if (hit && currentState === STATE.PLAYING) {
                const dmg = Math.min(hit.damage || 0, 40);
                player.hp -= dmg;
                damageTexts.push({
                    text: `-${dmg} от ${hit.fromName || '?'}`,
                    x: player.x, y: player.y - 50,
                    color: '#dc2626', life: 1.0
                });

                // Толчок
                const a = Math.atan2(player.y - (hit.y || player.y), player.x - (hit.x || player.x));
                player.x += Math.cos(a) * 20;
                player.y += Math.sin(a) * 20;

                if (player.hp <= 0) {
                    player.hp = 0;
                    triggerGameOver('Вас вырубил ' + (hit.fromName || 'кто-то') + '!');
                }
            }
            remove(snapshot.ref).catch(()=>{});
        });
    }

    function stopMultiplayer() {
        if (myPlayerRef) { remove(myPlayerRef).catch(()=>{}); myPlayerRef = null; }
        if (playersListenerOff) { playersListenerOff(); playersListenerOff = null; }
        if (hitsListenerOff) { hitsListenerOff(); hitsListenerOff = null; }
        remotePlayers.clear();
        multiplayerMode = false;
    }

    function sendMyState(now) {
        if (!multiplayerMode || !myPlayerRef) return;
        if (now - lastSend < 80) return;
        lastSend = now;
        set(myPlayerRef, {
            name: myName,
            x: Math.round(player.x * 10) / 10,
            y: Math.round(player.y * 10) / 10,
            angle: player.facingAngle,
            hp: Math.max(0, Math.round(player.hp)),
            score: player.score,
            hue: myHue,
            lastSeen: Date.now()
        });
    }

    // ================= GAME LOOP =================
    let lastTime = performance.now();

    function gameLoop(currentTime) {
        let dt = (currentTime - lastTime) / 1000;
        lastTime = currentTime;
        if (dt > 0.05) dt = 0.05;

        if (currentState === STATE.PLAYING) {
            updatePlayerMovement(dt);
            if (multiplayerMode) {
                sendMyState(performance.now());
            } else {
                updateNPCs(dt);
                checkCollisions();
                maintainWorldEntities();
            }
            updateHungerAndHealth(dt);
            updateEffects(dt);
            updateHUD();
        }

        render();
        requestAnimationFrame(gameLoop);
    }

    function updatePlayerMovement(dt) {
        if (player.attackCooldown > 0) player.attackCooldown -= dt;

        let moveX = 0, moveY = 0;
        if (keys.KeyW || keys.ArrowUp) moveY -= 1;
        if (keys.KeyS || keys.ArrowDown) moveY += 1;
        if (keys.KeyA || keys.ArrowLeft) moveX -= 1;
        if (keys.KeyD || keys.ArrowRight) moveX += 1;

        if (moveX !== 0 && moveY !== 0) { moveX *= 0.7071; moveY *= 0.7071; }

        if (joystick.active) { moveX = joystick.vectorX; moveY = joystick.vectorY; }

        if (moveX !== 0 || moveY !== 0) player.facingAngle = Math.atan2(moveY, moveX);

        player.x += moveX * player.speed * dt;
        player.y += moveY * player.speed * dt;
    }

    function updateNPCs(dt) {
        npcs.forEach(npc => {
            if (npc.flashTimer > 0) npc.flashTimer -= dt;
            if (npc.attackCooldown > 0) npc.attackCooldown -= dt;
            const d = Math.hypot(player.x - npc.x, player.y - npc.y);

            if (npc.isAggro) {
                const a = Math.atan2(player.y - npc.y, player.x - npc.x);
                npc.x += Math.cos(a) * npc.speed * dt;
                npc.y += Math.sin(a) * npc.speed * dt;

                if (d <= player.radius + npc.radius + 5 && npc.attackCooldown <= 0) {
                    npc.attackCooldown = 0.8;
                    const dmg = 8 + Math.floor(Math.random() * 8);
                    player.hp -= dmg;
                    player.x += Math.cos(a) * 15; player.y += Math.sin(a) * 15;
                    damageTexts.push({ text:`-${dmg}`, x:player.x, y:player.y-30, color:'#dc2626', life:0.8 });
                    if (player.hp <= 0) { player.hp = 0; triggerGameOver('Вас уничтожил дикий Яндекс Телемост!'); }
                }
            } else {
                npc.x += npc.vx * dt;
                npc.y += npc.vy * dt;
                if (Math.random() < 0.01) {
                    npc.vx = (Math.random() - 0.5) * 90;
                    npc.vy = (Math.random() - 0.5) * 90;
                }
            }
        });
    }

    function checkCollisions() {
        for (let i = foods.length - 1; i >= 0; i--) {
            const f = foods[i];
            if (Math.hypot(player.x - f.x, player.y - f.y) < player.radius + f.radius) {
                player.hunger = Math.min(player.maxHunger, player.hunger + f.value);
                player.hp = Math.min(player.maxHp, player.hp + 15);
                damageTexts.push({ text:'+15 HP', x:player.x, y:player.y-40, color:'#22c55e', life:0.9 });
                foods.splice(i, 1);
            }
        }
    }

    function updateHungerAndHealth(dt) {
        player.hunger -= 2.2 * dt;
        if (player.hunger <= 0) { player.hunger = 0; player.hp -= 8 * dt; }
        if (player.hp <= 0) { player.hp = 0; triggerGameOver('Вы умерли от голода и истощения!'); }
    }

    function updateEffects(dt) {
        punchEffects.forEach(p => { p.radius += 120 * dt; p.alpha -= 2.5 * dt; });
        punchEffects = punchEffects.filter(p => p.alpha > 0);

        damageTexts.forEach(d => { d.y -= 30 * dt; d.life -= dt; });
        damageTexts = damageTexts.filter(d => d.life > 0);
    }

    function updateHUD() {
        document.getElementById('hpBar').style.width = `${Math.max(0,(player.hp/player.maxHp)*100)}%`;
        document.getElementById('hpText').innerText = `${Math.ceil(player.hp)} / ${player.maxHp}`;
        document.getElementById('hungerBar').style.width = `${Math.max(0,(player.hunger/player.maxHunger)*100)}%`;
        document.getElementById('hungerText').innerText = `${Math.ceil(player.hunger)} / ${player.maxHunger}`;
        document.getElementById('scoreText').innerText = player.score;
        document.getElementById('coordsText').innerText = `X: ${Math.round(player.x)} | Y: ${Math.round(player.y)}`;
    }

    // ================ RENDER =================
    function drawEntityImage(img, x, y, radius, fallbackColor) {
        if (img.complete && img.naturalWidth !== 0) {
            ctx.drawImage(img, x - radius, y - radius, radius * 2, radius * 2);
        } else {
            ctx.fillStyle = fallbackColor;
            ctx.beginPath(); ctx.arc(x, y, radius, 0, Math.PI*2); ctx.fill();
        }
    }

    function drawNameTag(x, y, name, hp, maxHp, hue) {
        const hpPct = Math.max(0, hp / maxHp);
        const barW = 60, barH = 6;
        const barX = x - barW/2, barY = y - 50;
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(barX - 1, barY - 1, barW + 2, barH + 2);
        ctx.fillStyle = `hsl(${hue}, 70%, 55%)`;
        ctx.fillRect(barX, barY, barW * hpPct, barH);

        ctx.fillStyle = '#1e293b';
        ctx.font = 'bold 11px Rubik, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(name, x, barY - 4);
    }

    function render() {
        ctx.clearRect(0, 0, width, height);
        if (currentState === STATE.MENU) return;

        const cameraX = width/2 - player.x;
        const cameraY = height/2 - player.y;

        ctx.save();
        ctx.translate(cameraX, cameraY);

        // Grid
        const gs = 100;
        const sx = Math.floor((player.x - width) / gs) * gs;
        const ex = Math.floor((player.x + width) / gs) * gs;
        const sy = Math.floor((player.y - height) / gs) * gs;
        const ey = Math.floor((player.y + height) / gs) * gs;

        ctx.strokeStyle = '#e2e8f0'; ctx.lineWidth = 1;
        ctx.beginPath();
        for (let x = sx; x <= ex; x += gs) { ctx.moveTo(x, sy); ctx.lineTo(x, ey); }
        for (let y = sy; y <= ey; y += gs) { ctx.moveTo(sx, y); ctx.lineTo(ex, y); }
        ctx.stroke();

        // Food
        foods.forEach(f => drawEntityImage(foodImg, f.x, f.y, f.radius, '#f59e0b'));

        // Punch FX
        punchEffects.forEach(p => {
            ctx.save();
            ctx.strokeStyle = `rgba(239,68,68,${Math.max(0,p.alpha)})`;
            ctx.lineWidth = 4;
            ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI*2); ctx.stroke();
            ctx.restore();
        });

        // NPCs (single only)
        npcs.forEach(npc => {
            ctx.fillStyle = npc.isAggro ? 'rgba(239,68,68,0.35)' : 'rgba(0,0,0,0.1)';
            ctx.beginPath(); ctx.arc(npc.x, npc.y + npc.radius*0.5, npc.radius, 0, Math.PI*2); ctx.fill();

            ctx.save();
            if (npc.flashTimer > 0) ctx.filter = 'brightness(1.5) sepia(1) hue-rotate(-50deg) saturate(5)';
            drawEntityImage(playerImg, npc.x, npc.y, npc.radius, '#ef4444');
            ctx.restore();

            const hpPct = Math.max(0, npc.hp / npc.maxHp);
            const barW = 50, barH = 6, barX = npc.x - barW/2, barY = npc.y - npc.radius - 16;
            ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(barX-1, barY-1, barW+2, barH+2);
            ctx.fillStyle = '#ef4444'; ctx.fillRect(barX, barY, barW * hpPct, barH);

            ctx.fillStyle = npc.isAggro ? '#dc2626' : '#475569';
            ctx.font = 'bold 10px Rubik, sans-serif'; ctx.textAlign = 'center';
            ctx.fillText(npc.isAggro ? '😡 ВРАЖДЕБНЫЙ' : 'ДИКИЙ ТЕЛЕМОСТ', npc.x, barY - 4);
        });

        // Remote players (MP)
        if (multiplayerMode) {
            remotePlayers.forEach((rp) => {
                const hue = rp.hue || 200;
                ctx.fillStyle = `hsla(${hue},70%,50%,0.3)`;
                ctx.beginPath(); ctx.arc(rp.x, rp.y + 18, 30, 0, Math.PI*2); ctx.fill();

                ctx.save();
                ctx.filter = `drop-shadow(0 0 8px hsl(${hue},80%,55%))`;
                drawEntityImage(playerImg, rp.x, rp.y, 30, `hsl(${hue},70%,55%)`);
                ctx.restore();

                // Facing fist
                const fx = rp.x + Math.cos(rp.angle || 0) * 40;
                const fy = rp.y + Math.sin(rp.angle || 0) * 40;
                ctx.fillStyle = `hsl(${hue},80%,55%)`;
                ctx.beginPath(); ctx.arc(fx, fy, 7, 0, Math.PI*2); ctx.fill();

                drawNameTag(rp.x, rp.y, rp.name || 'Игрок', rp.hp || 100, 100, hue);
            });
        }

        // Local player
        ctx.fillStyle = 'rgba(0,0,0,0.15)';
        ctx.beginPath(); ctx.arc(player.x, player.y + player.radius*0.6, player.radius*0.9, 0, Math.PI*2); ctx.fill();

        ctx.save();
        if (multiplayerMode) ctx.filter = `drop-shadow(0 0 8px hsl(${myHue},80%,60%))`;
        drawEntityImage(playerImg, player.x, player.y, player.radius, '#eab308');
        ctx.restore();

        const fistX = player.x + Math.cos(player.facingAngle) * (player.radius + 10);
        const fistY = player.y + Math.sin(player.facingAngle) * (player.radius + 10);
        ctx.fillStyle = multiplayerMode ? `hsl(${myHue},80%,55%)` : '#ef4444';
        ctx.beginPath(); ctx.arc(fistX, fistY, 8, 0, Math.PI*2); ctx.fill();

        ctx.fillStyle = '#1e293b';
        ctx.font = 'bold 12px Rubik, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(multiplayerMode ? myName : 'ВЫ', player.x, player.y - player.radius - 8);

        // Floating texts
        damageTexts.forEach(d => {
            ctx.fillStyle = d.color;
            ctx.font = '800 16px Rubik, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(d.text, d.x, d.y);
        });

        ctx.restore();
    }

    function triggerGameOver(reason) {
        if (currentState === STATE.GAMEOVER) return;
        currentState = STATE.GAMEOVER;
        document.getElementById('deathReason').innerText = reason;
        document.getElementById('finalScore').innerText = player.score;
        document.getElementById('gameOverModal').classList.remove('hidden');

        // В мультиплеере — сообщим сети, что мы мертвы
        if (multiplayerMode && myPlayerRef) {
            set(myPlayerRef, {
                name: myName, x: player.x, y: player.y, angle: 0,
                hp: 0, score: player.score, hue: myHue, lastSeen: Date.now()
            });
        }
    }

    // ================ UI EVENTS =================
    document.getElementById('btnPlay').addEventListener('click', () => {
        stopMultiplayer();
        multiplayerMode = false;
        document.getElementById('mainMenu').classList.add('hidden');
        const hud = document.getElementById('gameHUD');
        hud.classList.remove('hidden'); hud.classList.add('flex');
        document.getElementById('scoreLabel').innerText = 'Победил в баттлах';
        document.getElementById('onlineText').innerText = '';
        currentState = STATE.PLAYING;
        lastTime = performance.now();
        initGame();
    });

    document.getElementById('btnMulti').addEventListener('click', async () => {
        const nameVal = (document.getElementById('nameInput').value || '').trim();
        if (!nameVal) {
            document.getElementById('mpStatus').innerText = '⚠️ Введите ник!';
            document.getElementById('nameInput').focus();
            return;
        }
        myName = nameVal.slice(0, 14);
        multiplayerMode = true;

        document.getElementById('mainMenu').classList.add('hidden');
        const hud = document.getElementById('gameHUD');
        hud.classList.remove('hidden'); hud.classList.add('flex');
        document.getElementById('scoreLabel').innerText = 'Ударов нанесено';
        document.getElementById('onlineText').innerText = '🌐 подключение...';

        currentState = STATE.PLAYING;
        lastTime = performance.now();
        initGame();
        startMultiplayer();
    });

    document.getElementById('btnRestart').addEventListener('click', () => {
        document.getElementById('gameOverModal').classList.add('hidden');
        currentState = STATE.PLAYING;
        lastTime = performance.now();
        if (multiplayerMode) {
            initGame();
            // обновляем HP в сети
            if (myPlayerRef) set(myPlayerRef, {
                name: myName, x: 0, y: 0, angle: 0,
                hp: player.maxHp, score: 0, hue: myHue, lastSeen: Date.now()
            });
        } else {
            initGame();
        }
    });

    document.getElementById('btnExit').addEventListener('click', () => {
        document.getElementById('gameOverModal').classList.add('hidden');
        const hud = document.getElementById('gameHUD');
        hud.classList.add('hidden'); hud.classList.remove('flex');
        document.getElementById('mainMenu').classList.remove('hidden');
        currentState = STATE.MENU;
        stopMultiplayer();
    });

    // На всякий случай — при закрытии вкладки убираем себя из БД
    window.addEventListener('beforeunload', () => {
        if (myPlayerRef) {
            try { remove(myPlayerRef); } catch(e) {}
        }
    });

    // Запуск
    initGame();
    requestAnimationFrame(gameLoop);
</script>
</body>
</html>
